<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UGV Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2f;
      color: #f0f0f0;
      margin: 0;
    }

    header {
      background: #2d2d44;
      padding: 15px;
      text-align: center;
      font-size: 1.5em;
      color: #00c896;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .container {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin-bottom: 30px;
    }

    .panel {
      background: #2d2d44;
      border-radius: 10px;
      padding: 15px;
      flex: 1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }

    .panel h2 { color: #00c896; }

    img {
      border-radius: 8px;
      object-fit: cover;
    }

    #cam { width: 320px; height: 240px; }
    #lidar { width: 400px; height: 400px; }

    a {
      color: #00c896;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { text-decoration: underline; }

    .controls {
      text-align: center;
      margin-top: 20px;
    }
    .controls button {
      background: #00c896;
      border: none;
      color: #fff;
      font-size: 1.2em;
      padding: 15px;
      margin: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .controls button:hover { background: #00a678; }
    .stop-btn, .controls .stop-btn {
      background: #e60000; /* Rojo intenso */
      color: #fff;
      font-size: 1.2em;
      font-weight: bold;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      margin: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
        .stop-btn:hover, .controls .stop-btn:hover {
      background: #b30000; /* Rojo oscuro al pasar el mouse */
    }

  </style>
</head>
<body>
  <header><strong>UGV Control Dashboard</strong></header>
  <div class="wrapper">

    <div class="container">
      <div class="panel">
        <h2>Camera</h2>
        <img id="cam" src="/camera" alt="Camera stream">
      </div>
      <div class="panel">
        <h2>LIDAR</h2>
        <img id="lidar" src="/lidar" alt="LIDAR map">
      </div>
    </div>

    <div class="controls">
      <h2>Manual Control</h2>
      <div>
        <button onclick="sendCommand('w')">Forward</button>
      </div>
      <div>
        <button onclick="sendCommand('a')">Left</button>
        <button onclick="sendCommand('x')" class="stop-btn">STOP</button>
        <button onclick="sendCommand('d')">Right</button>
      </div>
      <div>
        <button onclick="sendCommand('s')">Backward</button>
      </div>
    </div>

    <p><a href="/status">Ver estado del servidor</a></p>
  </div>

  <script>
    function sendCommand(cmd) {
      fetch('/control', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({command: cmd})
      }).then(res => console.log("Comando enviado:", cmd));
    }

    // Captura flechas del teclado
    document.addEventListener('keydown', function(e) {
      if (e.key === "ArrowUp") sendCommand('w');
      if (e.key === "ArrowDown") sendCommand('s');
      if (e.key === "ArrowLeft") sendCommand('a');
      if (e.key === "ArrowRight") sendCommand('d');
      if (e.key === " ") sendCommand('x'); // barra espaciadora = stop
    });
  </script>
</body>
</html>
